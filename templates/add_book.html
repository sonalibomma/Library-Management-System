{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="page-title mb-4">Add New Book</h2>

    <div class="card shadow-sm p-4">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Book Title</label>
                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter book title"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">ISBN</label>
                    <input
                        type="text"
                        name="isbn"
                        class="form-control"
                        placeholder="Enter ISBN"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Author Name</label>
                    <input
                        type="text"
                        name="author_name"
                        class="form-control"
                        placeholder="Enter author name"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Category</label>
                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        placeholder="Enter category"
                        required
                    >
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Published Year</label>
                    <input
                        type="number"
                        name="published_year"
                        class="form-control"
                        min="1000"
                        max="2100"
                        placeholder="Enter published year"
                        required
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Total Copies</label>
                    <input
                        type="number"
                        name="total_copies"
                        class="form-control"
                        min="0"
                        placeholder="Enter number of copies"
                        required
                    >
                </div>

            </div>

            <div class="mt-4">

                <button type="submit" class="btn btn-primary">
                    Save Book
                </button>

                <a href="{{ url_for('books') }}" class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
